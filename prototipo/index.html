<style>
/* Manual de marca Azúcar v1.0: carbón (rail), crema (fondo), guayaba solo como acento (estrella, acción principal); Outfit Black + Instrument Sans; corte de 16° en botones de acción */
:root{
  --bg:#F4EFE6; --surface:#FFFDF9; --surface2:#EFE8DC; --ink:#141414; --muted:#6A635A; --line:#E2D9CA;
  --rail:#141414; --rail-ink:#F4EFE6; --rail-muted:#A69E92;
  --accent:#F2545B; --accent-ink:#141414; --sugar:#E8DCC6; --sugar-ink:#141414;
  --ok:#11845B; --ok-bg:#DFF1E6; --warn:#A35F00; --warn-bg:#FBEBCF; --bad:#C42A33; --bad-bg:#FBE0DF; --info:#2E4A9E; --info-bg:#E2E8F6;
  --display:"Outfit","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414; --surface:#1E1D1B; --surface2:#262421; --ink:#F4EFE6; --muted:#A69E92; --line:#35322D;
  --rail:#0B0B0B; --rail-ink:#F4EFE6; --rail-muted:#8F887D;
  --accent:#F2545B; --accent-ink:#141414; --sugar:#3A342B; --sugar-ink:#F4EFE6; --ok:#4FD39C; --ok-bg:#12301F; --warn:#FFB65C; --warn-bg:#372A12; --bad:#FF767B; --bad-bg:#3B1719; --info:#9DB2F2; --info-bg:#1E2638;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1E1D1B; --surface2:#262421; --ink:#F4EFE6; --muted:#A69E92; --line:#35322D;
  --rail:#0B0B0B; --rail-ink:#F4EFE6; --rail-muted:#8F887D;
  --accent:#F2545B; --accent-ink:#141414; --sugar:#3A342B; --sugar-ink:#F4EFE6; --ok:#4FD39C; --ok-bg:#12301F; --warn:#FFB65C; --warn-bg:#372A12; --bad:#FF767B; --bad-bg:#3B1719; --info:#9DB2F2; --info-bg:#1E2638;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 6px 16px}
.wm{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;letter-spacing:-.03em;color:var(--rail-ink);white-space:nowrap}
.wm .tu{position:relative;display:inline-block}
.wm .tu svg{position:absolute;left:50%;top:-.42em;width:.5em;height:.5em;transform:translateX(-50%) rotate(16deg)}
.desc{border-left:1.5px solid var(--rail-muted);padding-left:9px;font-family:var(--display);font-weight:600;font-size:9.5px;letter-spacing:.22em;line-height:1.25;color:var(--rail-ink)}
.desc small{display:block;color:var(--rail-muted);letter-spacing:.12em;font-weight:600;font-size:9px;margin-top:2px}
.navgrp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);margin:14px 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--rail-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--rail-ink);color:var(--rail)}
.nav a.on svg{color:var(--accent);opacity:1}
.nav svg{width:17px;height:17px;flex:none;opacity:.9}
.main{min-width:0;padding-block:20px 48px;padding-left:max(16px,2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.2vw)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--display);font-weight:900;font-size:32px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.05;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.p-sugar{background:var(--sugar);color:var(--sugar-ink)}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);padding-inline:20px;border-radius:0}
a.btn{text-decoration:none;display:inline-block}
.btn.pri:hover{filter:brightness(1.07)}
.btn:focus-visible,.nav a:focus-visible,.sel:focus-visible,input:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .d{font-size:12px;margin-top:6px}
.up{color:var(--ok)} .down{color:var(--bad)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.r{text-align:right}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{background:var(--sugar);color:var(--sugar-ink);border-radius:8px;padding:10px 12px;font-size:13px}
.stars{color:#E6A800;letter-spacing:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.col h4{margin:2px 4px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}
.lead b{display:block}
.sched{display:grid;grid-template-columns:64px repeat(7,minmax(110px,1fr));min-width:880px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sched .h{padding:8px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);background:var(--surface2)}
.sched .t{padding:6px 8px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.sched .c{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;min-height:44px}
.cls{border-radius:6px;padding:5px 7px;font-size:11.5px;line-height:1.25;margin-bottom:3px;color:#fff}
.cls b{display:block;font-size:12px}
.scan{aspect-ratio:4/3;max-width:100%;background:#0B0E20;border-radius:12px;position:relative;overflow:hidden;display:grid;place-items:center}
.scan svg{width:56%;max-width:240px}
.scanline{position:absolute;left:8%;right:8%;height:2px;background:#3DF0B0;box-shadow:0 0 14px #3DF0B0;top:15%;animation:sc 1.6s ease-in-out infinite alternate}
@keyframes sc{to{top:82%}}
@media (prefers-reduced-motion:reduce){.scanline{animation:none;top:50%}}
.result{border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center}
.result.ok{background:var(--ok-bg);color:var(--ok)} .result.bad{background:var(--bad-bg);color:var(--bad)} .result.warn{background:var(--warn-bg);color:var(--warn)}
.result .big{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.gate{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}
.phone{width:300px;max-width:100%;border-radius:34px;border:10px solid var(--ink);background:var(--bg);padding:18px 14px;margin-inline:auto}
.qr{width:150px;height:150px;margin:8px auto;display:block;background:#fff;padding:8px;border-radius:8px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.18);padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow-y:auto;z-index:30}
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.35);z-index:29}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:40}
.check{color:var(--ok);font-weight:800} .x{color:var(--line)}
.price{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:var(--surface)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wa{background:#E7FFDB;color:#10301A;border-radius:10px 10px 10px 2px;padding:10px 12px;font-size:13px;max-width:320px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
[style*="--display"]{font-weight:900;letter-spacing:-.02em}
.who{background:rgba(255,255,255,.06);border-radius:10px;padding:10px;margin:0 0 6px}
.who label{color:var(--rail-muted);display:block;margin-bottom:5px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.rolesel{width:100%;background:var(--rail);color:var(--rail-ink);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:7px 8px;font-weight:600}
.whou{font-size:12px;color:var(--rail-muted);margin-top:6px}
.priv{background:var(--info-bg);color:var(--info);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.priv svg{width:18px;height:18px;flex:none;margin-top:1px}
.vgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.vid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.vid:hover{border-color:var(--muted)}
.vid .meta{padding:10px 12px 12px;display:grid;gap:6px}
.thumb{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden;color:#fff}
.thumb .play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.thumb .play svg{width:18px;height:18px;margin-left:3px}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);font-size:11px;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.thumb .seen{position:absolute;left:8px;top:8px;background:#11845B;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.thumb .lbl{position:absolute;left:12px;bottom:10px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.01em;opacity:.9}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:31;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;width:min(760px,100%);padding:16px;max-height:90vh;overflow:auto}
.daycol{display:grid;gap:8px}
.slot{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex-wrap:wrap}
.slot .hh{font-family:var(--display);font-weight:800;font-size:18px;width:62px;font-variant-numeric:tabular-nums}
.slot .sw{width:6px;align-self:stretch;border-radius:3px}
.roster label{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.roster input{width:18px;height:18px;accent-color:var(--accent)}
.menu-btn{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding-block:12px 8px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .brand{padding-bottom:8px}
  .nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
  .nav a{white-space:nowrap;padding:7px 10px}
  .navgrp{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){.g4{grid-template-columns:minmax(0,1fr)}.kv{grid-template-columns:110px 1fr}.top h1{font-size:32px}}
</style>

<script>
/* ---------- utilidades ---------- */
const HOY = new Date(2026,10,9);
const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(n).toLocaleString('es-MX');
const fdate = d => d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'}).replace('.','');
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const diff = d => Math.round((d - HOY)/86400000);
let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const pick = a => a[Math.floor(rnd()*a.length)];
const ini = n => n.split(' ').slice(0,2).map(s=>s[0]).join('');
const AVC = ['#F2545B','#2F4FD8','#11845B','#B0469E','#D9761A','#0E8A9A','#6B4FD8'];
const avc = s => AVC[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%AVC.length];
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2400); }
const ic = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

/* ---------- catálogo real (flyers ADS 2026) ---------- */

  flexipass:{nombre:'Flexipass', desc:'Clases prepagadas · vigencia 3 meses hasta agotar', filas:['1 clase','4 clases','8 clases','10 clases','16 clases'],

  particulares:{nombre:'Clases particulares', desc:'Flexipass todos los ritmos · vigencia 6 meses', filas:['1 clase','4 clases','8 clases','10 clases','16 clases'],
    cols:{'Individual · sucursal':[699,2499,4799,5699,8399],'Pareja · sucursal':[799,2999,5899,6799,9999],'Grupal 5–10 · sucursal':[1299,4399,8499,9999,14999],
          'Individual · domicilio':[899,3499,6799,8399,12599],'Pareja · domicilio':[999,3778,7099,8899,12999],'Grupal 5–10 · domicilio':[1349,4599,9199,10999,16799]}},
  coreografias:{nombre:'Coreografías XV años y boda', desc:'Mix de 2–3 min por coreografía · apartado 50%, liquidar 3 ensayos antes de terminar', filas:['Sugar Pop · 1 coreo · 8 h','Candy · 2 coreos · 12 h','Lollipop · 3 coreos · 18 h','Súper Pop · 4 coreos · 22 h'],
    cols:{'Boda · estudio':[7999,11499,14999,16999],'Boda · domicilio':[8999,12499,15999,17999],'XV · estudio':[8399,11999,15499,16999],'XV · domicilio':[9399,12999,15999,17999]}},
  renta:{nombre:'Renta de salones', desc:'Flexipass de horas · vigencia 3 meses · aparta con 50%', filas:['1 hora','4 horas','8 horas'],
    cols:{'Salón 32 m²':[275,250,225],'Salón 55 m²':[300,275,250],'Salón 70 m²':[350,300,275],'Salón 100 m²':[500,450,400]}, unidad:'/hora'},
  cursos:{nombre:'Cursos para principiantes', desc:'8 sesiones presenciales · Bachata, Baile para fiestas, Cumbia, Salsa cubana, Salsa en línea', filas:['Preventa 3 (hasta 3 nov)','Precio regular'],
    cols:{'Individual':[749,1200],'Pareja':[1299,2400]}}
};
const REGLAS = {inscripcion:400, reactivacion:120, reinsc6m:200, reinsc1a:400, credencial:35, ensayoExtra:1000, coreoSuelta:4999};

/* ---------- datos de ejemplo ---------- */
const NOM = ['Valeria','Diego','Ximena','Andrés','Mariana','Luis','Fernanda','Jorge','Paola','Emilio','Renata','Iván','Camila','Óscar','Daniela','Héctor','Sofía','Rodrigo','Lucía','Mauricio','Regina','Alan','Itzel','Bruno','Natalia','Gael','Abril','Tomás','Karla','Rubén'];
const APE = ['Ramírez','Ortega','Salinas','Cruz','Navarro','Mendoza','Villalobos','Herrera','Campos','Ríos','Aguilar','Bautista','Luna','Peña','Solís','Ibarra','Montes','Rangel','Zamora','Fuentes'];
const PROFES = [
  {n:'Fernando Valdez',d:'Ritmos Cubanos · Salsa cubana',r:4.9,cl:46,asis:17.8,nps:82,suc:'Portales'},

function barChart(data, keys, colors, h=210){
  const W=640, pad={l:46,r:10,t:10,b:26};
  const max = Math.max(...data.map(d=>keys.reduce((a,k)=>a+d[k],0)));
  const top = Math.ceil(max/50000)*50000;
  const bw = (W-pad.l-pad.r)/data.length;
  const y = v => pad.t + (h-pad.t-pad.b)*(1-v/top);
  let g='';
  for(let i=0;i<=4;i++){ const v=top*i/4; g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end">${v/1000}k</text>`; }
  data.forEach((d,i)=>{ let acc=0; const x=pad.l+i*bw+bw*.2;
    keys.forEach((k,j)=>{ const y0=y(acc), y1=y(acc+d[k]); g+=`<rect x="${x}" y="${y1}" width="${bw*.6}" height="${y0-y1}" fill="${colors[j]}" rx="2"><title>${d.m} · ${k}: ${money(d[k])}</title></rect>`; acc+=d[k]; });
    g+=`<text x="${x+bw*.3}" y="${h-8}" text-anchor="middle">${d.m}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Ingresos por mes">${g}</svg>`;
}
function spark(vals,color='var(--accent)'){
  const W=120,H=34,mx=Math.max(...vals),mn=Math.min(...vals);
  const pts=vals.map((v,i)=>[i*(W/(vals.length-1)),H-3-(H-6)*(v-mn)/((mx-mn)||1)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const l=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${d} L${W} ${H} L0 ${H}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${l[0]}" cy="${l[1]}" r="3" fill="${color}"/></svg>`;
}

  return out;
}

  'Ritmos cubanos':[['Rumba guaguancó: base','15:15','Intermedio',1],['Orishas: Elegguá y Ogún','19:40','Intermedio',0],['Son: historia y paso básico','11:30','Básico',0]],

};
const MIS_DISC = ['Protocolo Azúcar','Bachata','Salsa en línea'];
const VISTOS = new Set(['Protocolo Azúcar|0','Protocolo Azúcar|1','Bachata|0','Bachata|1','Bachata|2','Salsa en línea|0','Salsa en línea|2']);
let CAPD = 'Bachata';
function obligatorios(){ let t=0,v=0; MIS_DISC.forEach(d=>VID[d].forEach((x,i)=>{ if(x[3]){t++; if(VISTOS.has(d+'|'+i)) v++;} })); return [v,t]; }
const playIc = `<svg viewBox="0 0 24 24" fill="#151A36"><path d="M7 4.5v15l12-7.5z"/></svg>`;
V.capacitacion = () => {
  const esProfe = ROLE==='profe';
  const discs = Object.keys(VID);
  const [v,t] = obligatorios();
  const vids = VID[CAPD];
  const cumpl = [['Fernando Valdez',100,0],['Ana Lucía Torres',92,1],['Kevin Morales',Math.round(v/t*100),t-v],['Daniela Pérez',100,0],['Marco Rentería',54,6],['Paulina Ochoa',78,2]];
  return header('Capacitación', esProfe?'Videos de tu disciplina y protocolos del estudio':'Biblioteca de videos por disciplina y avance de cada profesor',
    esProfe?'':`<button class="btn" id="asignar">Asignar ruta</button><button class="btn pri" id="subirvid">+ Subir video</button>`) + `
  ${esProfe?`<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>Tu ruta obligatoria: ${MIS_DISC.join(', ')}</b><span class="pill ${v===t?'p-ok':'p-warn'}">${v} de ${t} videos</span></div><div class="bar" style="margin-top:8px"><i style="width:${v/t*100}%"></i></div><div class="small muted" style="margin-top:6px">Completa los obligatorios antes del 30 de noviembre. Cada video tiene una mini evaluación de 3 preguntas.</div></div>`:''}
  <div class="tabs">${discs.map(d=>`<button class="tab ${d===CAPD?'on':''}" data-disc="${d}">${d}${esProfe&&MIS_DISC.includes(d)?' ★':''} · ${VID[d].length}</button>`).join('')}</div>
  <div class="vgrid">${vids.map((x,i)=>{ const k=CAPD+'|'+i, seen=esProfe&&VISTOS.has(k); return `<button class="vid" data-vid="${k}"><div class="thumb" style="background:linear-gradient(135deg,${DCOL[CAPD]},#0B0E20)"><span class="lbl">${CAPD}</span><span class="play">${playIc}</span><span class="dur">${x[1]}</span>${seen?'<span class="seen">Visto ✓</span>':''}</div><div class="meta"><b>${x[0]}</b><div class="row" style="gap:6px"><span class="pill p-mute">${x[2]}</span>${x[3]?'<span class="pill p-warn">Obligatorio</span>':'<span class="pill p-info">Opcional</span>'}</div></div></button>`; }).join('')}</div>
  ${esProfe?'':`<div class="card" style="margin-top:14px;padding:0"><div style="padding:16px 16px 0"><h3>Avance de capacitación por profesor</h3></div><div class="tw"><table><thead><tr><th>Profesor</th><th>Ruta obligatoria</th><th class="r">Pendientes</th><th>Estado</th></tr></thead><tbody>
    ${cumpl.map(c=>`<tr><td><b>${c[0]}</b></td><td style="min-width:160px"><div class="bar"><i style="width:${c[1]}%;background:${c[1]===100?'var(--ok)':c[1]<60?'var(--bad)':'var(--accent)'}"></i></div><span class="small">${c[1]}%</span></td><td class="r">${c[2]}</td><td><span class="pill ${c[1]===100?'p-ok':c[1]<60?'p-bad':'p-warn'}">${c[1]===100?'Completo':c[1]<60?'Atrasado':'En curso'}</span></td></tr>`).join('')}
  </tbody></table></div></div>`}`;
};
function videoModal(k){
  const [d,i] = k.split('|'); const x = VID[d][+i]; const esProfe = ROLE==='profe';
  $('#layer').innerHTML = `<div class="scrim" id="scrim"></div><div class="modal" role="dialog" aria-label="${x[0]}"><div class="box">
    <div class="thumb" style="border-radius:8px;background:linear-gradient(135deg,${DCOL[d]},#0B0E20)"><span class="lbl">${d}</span><span class="play" style="width:64px;height:64px">${playIc}</span><span class="dur">${x[1]}</span></div>
    <div class="row" style="margin-top:12px"><div style="min-width:0"><b style="font-size:17px">${x[0]}</b><div class="small muted">${d} · ${x[2]} · ${x[1]} min</div></div><span class="spacer"></span><button class="btn" id="cerrar" aria-label="Cerrar">✕</button></div>
    <div class="small muted" style="margin-top:8px">En el sistema real el video se reproduce aquí, alojado de forma privada (sin descarga ni link público). Al terminar aparece una mini evaluación de 3 preguntas.</div>
    <div class="row" style="margin-top:12px">${esProfe?`<button class="btn pri" id="visto">${VISTOS.has(k)?'Ya lo viste ✓':'Marcar como visto'}</button>`:`<span class="small">Vistas: <b>${4+(+i*3)%3}</b> de 6 profesores · calificación de la evaluación: <b>8.7</b></span>`}</div>
  </div></div>`;
  $('#scrim').onclick=$('#cerrar').onclick=()=>$('#layer').innerHTML='';
  const vb=$('#visto'); if(vb) vb.onclick=()=>{ VISTOS.add(k); $('#layer').innerHTML=''; render(); toast('Video completado'); };
}

/* ---------- turno del staff ---------- */
V.turno = () => {
  const conceptos=[['Memberpass Social Dance 2 clases x semana',779,'Tarjeta débito'],['Curso Bachata principiantes',749,'Efectivo'],['Flexipass Aerial 4 clases',549,'Efectivo'],['Memberpass Social Dance 2x semana + recargo 10%',857,'Transferencia SPEI'],['Clase suelta Social Dance',150,'Efectivo'],['Inscripción + Memberpass 1 clase x semana',869,'Tarjeta crédito'],['Reposición de credencial',35,'Efectivo'],['Particular individual 4 clases',2499,'Tarjeta crédito'],['Curso Salsa en línea en pareja',1299,'Efectivo']];
  const horas=['14:12','14:40','15:05','16:22','17:10','17:48','18:31','18:55','19:04'];
  const ventas=conceptos.map((c,i)=>({h:horas[i],a:SOCIOS[(i*4+3)%SOCIOS.length].nombre,c:c[0],m:c[1],p:c[2]}));
  const tot=ventas.reduce((a,v)=>a+v.m,0);
  const por=p=>ventas.filter(v=>v.p.startsWith(p)).reduce((a,v)=>a+v.m,0);
  const fondo=1000, efe=por('Efectivo'), esp=fondo+efe;
  return header('Mi turno y caja','Erika Salas · Recepción Portales · turno de 14:00 a 22:00') + `
  ${ROLE==='staff'?priv('Tu perfil ve tus ventas del día, tu corte de caja y el historial de membresía de cada alumno. Los ingresos totales del estudio, utilidades y KPIs financieros solo los ven los socios.'):''}
  <div class="grid g4" style="margin-top:14px">
    <div class="card kpi"><div class="l">Mis ventas del turno</div><div class="v">${money(tot)}</div><div class="d muted">${ventas.length} cobros</div></div>
    <div class="card kpi"><div class="l">Efectivo esperado en caja</div><div class="v">${money(esp)}</div><div class="d muted">Fondo ${money(fondo)} + ventas ${money(efe)}</div></div>
    <div class="card kpi"><div class="l">Check-ins atendidos</div><div class="v">87</div><div class="d muted">4 denegados por adeudo</div></div>
    <a class="card kpi" href="#crm" style="text-decoration:none;color:inherit"><div class="l">Renovaciones por llamar hoy</div><div class="v">12</div><div class="d" style="color:var(--accent)">Ver lista →</div></a>
  </div>
  <div class="grid g-main" style="margin-top:14px">
    <div class="card" style="padding:0"><div style="padding:16px 16px 0"><h3>Ventas del día</h3></div><div class="tw"><table><thead><tr><th>Hora</th><th>Alumno</th><th>Concepto</th><th>Pago</th><th class="r">Monto</th></tr></thead><tbody>
      ${ventas.map(v=>`<tr><td>${v.h}</td><td>${v.a}</td><td class="small">${v.c}</td><td class="small">${v.p}</td><td class="r">${money(v.m)}</td></tr>`).join('')}
      <tr><td colspan="4"><b>Total del turno</b></td><td class="r"><b>${money(tot)}</b></td></tr>
    </tbody></table></div></div>
    <div class="card" style="align-self:start"><h3>Corte de caja</h3>
      <table><tbody>
        <tr><td>Fondo inicial</td><td class="r">${money(fondo)}</td></tr>
        <tr><td>Ventas en efectivo</td><td class="r">${money(efe)}</td></tr>
        <tr><td><b>Efectivo esperado</b></td><td class="r"><b>${money(esp)}</b></td></tr>
        <tr><td>Terminal (débito y crédito)</td><td class="r">${money(por('Tarjeta'))}</td></tr>
        <tr><td>Transferencias</td><td class="r">${money(por('Transferencia'))}</td></tr>
      </tbody></table>
      <label class="small" for="contado" style="display:block;margin-top:12px">Efectivo contado en caja</label>
      <div class="row" style="margin-top:4px"><input class="sel" id="contado" type="number" min="0" inputmode="numeric" data-esp="${esp}" placeholder="${esp}" style="width:140px"><span class="pill p-mute" id="difcorte">—</span></div>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="cerrarturno">Cerrar turno y enviar corte</button></div>
      <div class="small muted" style="margin-top:8px">Si hay diferencia, el sistema pide un comentario y avisa al gerente.</div>
    </div>
  </div>`;
};

/* ---------- render y eventos ---------- */
function render(){
  let cur = location.hash.slice(1) || ROLES[ROLE].home;
  if(!ROLES[ROLE].v.includes(cur) || !V[cur]){ cur = ROLES[ROLE].home; try{ history.replaceState(null,'','#'+cur); }catch(e){} }
  seed = 7 + cur.length;
  nav(cur);
  $('#main').innerHTML = V[cur]();
  bindSuc();
  $('#rolesel').onchange = e => { ROLE = e.target.value; try{ localStorage.setItem('azos-role',ROLE); }catch(_){} $('#layer').innerHTML=''; if(location.hash==='#'+ROLES[ROLE].home) render(); else location.hash = ROLES[ROLE].home; };
  document.querySelectorAll('[data-lista]').forEach(b=>b.onclick=()=>{ LISTA=+b.dataset.lista; location.hash='misalumnos'; });
  const ls=$('#listasel'); if(ls) ls.onchange=()=>{ LISTA=+ls.value; render(); };
  const upd=()=>{ const n=document.querySelectorAll('.roster input:checked').length; const t=document.querySelectorAll('.roster input').length; const c=$('#presentes'); if(c) c.textContent=`${n} de ${t} presentes`; };
  document.querySelectorAll('.roster input').forEach(i=>i.onchange=upd); upd();
  const gl=$('#guardalista'); if(gl) gl.onclick=()=>toast('Asistencia guardada · se descontaron clases de Flexipass');
  document.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>{ CAPD=b.dataset.disc; render(); });
  document.querySelectorAll('[data-vid]').forEach(b=>b.onclick=()=>videoModal(b.dataset.vid));
  const cc=$('#contado'); if(cc){ const f=()=>{ const esp=+cc.dataset.esp, v=+cc.value||0, d=v-esp; const o=$('#difcorte'); o.textContent = cc.value===''?'—':(d===0?'Cuadra ✓':(d>0?'Sobrante ':'Faltante ')+money(Math.abs(d))); o.className='pill '+(cc.value===''?'p-mute':d===0?'p-ok':'p-bad'); }; cc.oninput=f; f(); }
  const ct=$('#cerrarturno'); if(ct) ct.onclick=()=>toast('Corte enviado al gerente de sucursal (ejemplo)');
  [['#subirvid','Subir video: se aloja privado en Vimeo o Bunny Stream (próxima fase)'],['#asignar','Asignar ruta de capacitación (próxima fase)']].forEach(([s,t])=>{const e=$(s); if(e) e.onclick=()=>toast(t);});
  document.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>{const k=b.dataset.scan; lastScan = k==='x'?'x':[SOCIOS[2],SOCIOS[0],SOCIOS[1]][+k]; render(); if(k!=='x'){const e=estado(lastScan); toast(e.acceso?'Torniquete abierto · Portales 1':'Torniquete bloqueado');}});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FILTRO=b.dataset.f;render();});
  document.querySelectorAll('tr[data-id]').forEach(t=>t.onclick=()=>drawer(SOCIOS.find(s=>s.id==t.dataset.id)));
  const bu=$('#busca'); if(bu){ bu.oninput=()=>{BUSCA=bu.value; const p=bu.selectionStart; render(); const n=$('#busca'); n.focus(); n.setSelectionRange(p,p);}; }
  document.querySelectorAll('[data-suc]').forEach(b=>b.onclick=()=>{SALAS_SUC=b.dataset.suc;render();});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{POS.cat=b.dataset.cat;POS.fila=0;render();});
  document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{POS.col=b.dataset.col;render();});
  document.querySelectorAll('[data-fila]').forEach(b=>b.onclick=()=>{POS.fila=+b.dataset.fila;render();});
  document.querySelectorAll('[data-crm]').forEach(b=>b.onclick=()=>{CRMTAB=b.dataset.crm;render();});
  const nc=$('#nuevo-chk'); if(nc) nc.onchange=()=>{POS.nuevo=nc.checked;render();};
  const at=$('#atraso'); if(at) at.onchange=()=>{POS.atraso=Math.max(0,+at.value||0);render();};
  const me=$('#metodo'); if(me) me.onchange=()=>{POS.metodo=me.value;render();};
  const co=$('#cobrar'); if(co) co.onclick=()=>toast('Venta registrada · recibo enviado por WhatsApp (ejemplo)');
  [['#nuevo','Formulario de alta: datos, foto de rostro y consentimiento (próxima fase)'],['#nlead','Alta de lead (próxima fase)'],['#ncamp','Editor de campañas (próxima fase)'],['#corte','Corte de caja generado (ejemplo)']].forEach(([s,t])=>{const e=$(s); if(e) e.onclick=()=>toast(t);});
  document.querySelectorAll('.phone .btn').forEach(b=>b.onclick=()=>toast('Acción de la app (ejemplo)'));
}
window.addEventListener('hashchange',()=>{ $('#layer').innerHTML=''; render(); window.scrollTo(0,0); });
render();
</script>
